<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dakhil: Our Tender Document Package Builder</title>
    <meta
      name="description"
      content="Dakhil turns a tender's required-documents list and your PDFs into one checked, ordered, page-numbered package. Everything stays in your browser."
    />
    <meta name="theme-color" content="#1D3F8F" />
    <script>
      // Apply the saved (or system) theme before first paint, so the page never flashes the wrong one.
      try {
        var t = localStorage.getItem("dakhil.theme");
        if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/dakhil-32.png" />
    <link rel="apple-touch-icon" href="/brand/dakhil-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Dakhil needs JavaScript to read and combine your PDF files in this browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
